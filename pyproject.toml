[project]
name = "email-agent"
version = "0.1.0"
description = "An email agent built on a home-built harness: tools, hooks, memory, context engineering, and evals."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2,<3",
    "pydantic>=2.14.4",
    "typer>=0.29.2",
]

[project.scripts]
email-agent = "email_agent.cli:app"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv]
# One uv version range for local runs and CI (setup-uv reads it). When upgrading
# uv, bump this and the uv_build range in [build-system] together.
required-version = ">=0.9.28,<0.10"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["email_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
